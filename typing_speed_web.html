<!doctype html>
<html lang="en" data-ru-title="Тест скорости печати">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Speed Test</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #22242a;
    --muted: #62656e;
    --line: #dcdbd4;
    --accent: #0b6e75;
    --good: #1a7a43;
    --bad-bg: #c62f3a;
    --bad-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191d;
      --panel: #21242a;
      --ink: #eceded;
      --muted: #a2a6af;
      --line: #383c44;
      --accent: #5cc8cf;
      --good: #63d08e;
      --bad-bg: #d9434f;
      --bad-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.01em; }
  h2 { margin: 0 0 20px; font-size: 22px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .intro { margin-bottom: 32px; }
  .hint { margin-top: 20px; font-size: 14px; color: var(--muted); }
  .message { margin-top: 16px; font-weight: 600; color: var(--accent); }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  kbd {
    display: inline-block;
    min-width: 1.6em;
    margin-right: 10px;
    padding: 0 5px;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
    font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    text-align: center;
  }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .levels button { padding: 20px 16px; font-size: 18px; font-weight: 600; }
  .choice { display: flex; gap: 8px; margin-bottom: 20px; }
  .choice button { padding: 4px 12px; font-size: 14px; }
  .choice button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .modes { margin-bottom: 12px; }
  .tips-link { margin-top: 12px; width: 100%; text-align: left; }
  .best-scores { margin-top: 40px; }
  @media (max-width: 480px) { .levels { grid-template-columns: 1fr; } }

  .stats { display: flex; flex-wrap: wrap; gap: 8px 32px; margin-bottom: 20px; }
  .stat-label { display: block; font-size: 13px; color: var(--muted); }
  .stat-value {
    font-size: 24px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .text {
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 22px/1.8 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* A one minute text is long, so only four lines show at a time. */
  .text.minute {
    position: relative;
    height: calc(4 * 1.8em);
    box-sizing: content-box;
    padding-block: 0;
    overflow: hidden;
  }
  .char { color: var(--muted); }

  .keyboard { display: block; width: 100%; height: auto; margin-top: 20px; }
  .key rect { fill: var(--panel); stroke: var(--line); }
  .key text { fill: var(--muted); font-size: 15px; font-weight: 600; text-anchor: middle; }
  .key.next rect { fill: var(--accent); stroke: var(--accent); }
  .key.next text { fill: var(--bg); }
  .palm { fill: var(--muted); fill-opacity: 0.3; }
  .finger { stroke: var(--muted); stroke-opacity: 0.3; stroke-width: 22; stroke-linecap: round; }
  .finger.active { stroke: var(--accent); stroke-opacity: 0.75; }
  .char.good { color: var(--good); }
  .char.bad { color: var(--bad-ink); background: var(--bad-bg); }
  .char.current { color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }

  .results { margin: 0 0 8px; }
  .results div {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .results dt { color: var(--muted); }
  .results dd {
    margin: 0;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .results .speed dd { font-size: 24px; color: var(--good); }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 13px; font-weight: 500; color: var(--muted); }
  .number { text-align: right; font-variant-numeric: tabular-nums; }
  .back { margin-top: 24px; }
</style>
</head>
<body>
<main>
  <section id="menu">
    <div class="choice">
      <button type="button" data-language="en" lang="en">English</button>
      <button type="button" data-language="ru" lang="ru">Русский</button>
    </div>
    <h1 data-ru="Тест скорости печати">Typing Speed Test</h1>
    <p class="muted intro" data-ru="Выберите уровень. Таймер запустится, когда вы начнете печатать.">Choose a level. The timer starts when you start typing.</p>
    <div class="choice modes">
      <button type="button" data-mode="text"><span data-ru="Весь текст">Full text</span></button>
      <button type="button" data-mode="minute"><kbd>M</kbd><span data-ru="1 минута">1 minute</span></button>
    </div>
    <div class="levels">
      <button type="button" data-level="Easy"><kbd>1</kbd><span data-ru="Легкий">Easy</span></button>
      <button type="button" data-level="Medium"><kbd>2</kbd><span data-ru="Средний">Medium</span></button>
      <button type="button" data-level="Hard"><kbd>3</kbd><span data-ru="Сложный">Hard</span></button>
    </div>
    <button type="button" class="tips-link" id="show-tips"><kbd>H</kbd><span data-ru="Как печатать быстрее">How to type faster</span></button>
    <p class="message" id="menu-message" role="alert" hidden></p>
    <div class="best-scores">
      <h2 data-ru="Лучшие результаты">Best scores</h2>
      <p class="muted" id="no-scores" hidden data-ru="Результатов пока нет. Сыграйте первый раунд!">No scores yet. Play a round first!</p>
      <table id="score-table" hidden>
        <thead>
          <tr>
            <th>#</th><th class="number" data-ru="Сл/мин">WPM</th><th class="number" data-ru="Точность">Accuracy</th>
            <th data-ru="Уровень">Level</th><th data-ru="Дата">Date</th>
          </tr>
        </thead>
        <tbody id="score-rows"></tbody>
      </table>
    </div>
  </section>

  <section id="game" hidden>
    <h2 id="game-level"></h2>
    <div class="stats">
      <p><span class="stat-label" data-ru="Время">Time</span><span class="stat-value" id="stat-time"></span></p>
      <p><span class="stat-label" data-ru="Сл/мин">WPM</span><span class="stat-value" id="stat-wpm"></span></p>
      <p><span class="stat-label" data-ru="Точность">Accuracy</span><span class="stat-value" id="stat-accuracy"></span></p>
    </div>
    <div class="text" id="text"></div>
    <svg class="keyboard" id="keyboard" viewBox="0 0 640 330" aria-hidden="true"></svg>
    <p class="hint" data-ru="Backspace: исправить ошибку, Esc: в меню. Включите русскую раскладку клавиатуры.">Backspace: fix a mistake &nbsp; Esc: back to menu</p>
  </section>

  <section id="results" hidden>
    <h2 data-ru="Результаты">Results</h2>
    <dl class="results">
      <div class="speed"><dt data-ru="Скорость">Speed</dt><dd id="result-wpm"></dd></div>
      <div><dt data-ru="Точность">Accuracy</dt><dd id="result-accuracy"></dd></div>
      <div><dt data-ru="Ошибки">Mistakes</dt><dd id="result-mistakes"></dd></div>
      <div><dt data-ru="Время">Time</dt><dd id="result-time"></dd></div>
    </dl>
    <p class="message" id="result-message" role="status" hidden></p>
    <button type="button" class="back" data-back><kbd>Enter</kbd><span data-ru="В меню">Back to menu</span></button>
  </section>
</main>

<script>
  const language = localStorage.getItem("language") === "ru" ? "ru" : "en";
  const say = (english, russian) => (language === "ru" ? russian : english);

  // The English text is in the HTML; Russian is kept in data-ru attributes.
  if (language === "ru") {
    document.documentElement.lang = "ru";
    document.title = document.documentElement.dataset.ruTitle;
    for (const item of document.querySelectorAll("[data-ru]")) {
      item.textContent = item.dataset.ru;
    }
    for (const item of document.querySelectorAll("[data-ru-label]")) {
      item.setAttribute("aria-label", item.dataset.ruLabel);
    }
  }

  const CHARS_PER_WORD = 5;  // The same "standard word" as the terminal game.
  const MINUTE_SECONDS = 60;
  const LEVEL_NAMES = {
    Easy: say("Easy", "Легкий"),
    Medium: say("Medium", "Средний"),
    Hard: say("Hard", "Сложный"),
  };
  const SERVER_ERROR = say("Could not reach the game server. Is it still running?",
                           "Нет связи с сервером игры. Он еще работает?");

  const screens = ["menu", "game", "results"];
  const element = (id) => document.getElementById(id);

  let screen = "menu";
  let round = null;
  let timer = null;
  let mode = localStorage.getItem("mode") === "minute" ? "minute" : "text";

  function showScreen(name) {
    screen = name;
    for (const id of screens) element(id).hidden = id !== name;
    if (document.activeElement) document.activeElement.blur();
  }

  function showMessage(id, text) {
    element(id).textContent = text;
    element(id).hidden = !text;
  }

  function goToMenu() {
    clearInterval(timer);
    round = null;
    showScreen("menu");
  }

  async function fetchJson(url, options) {
    const response = await fetch(url, options);
    if (!response.ok) throw new Error(`Request failed: ${response.status}`);
    return response.json();
  }

  // ----- Playing a round -----

  async function startRound(level) {
    let data;
    try {
      data = await fetchJson(
        `/api/text?level=${encodeURIComponent(level)}&lang=${language}&mode=${mode}`);
    } catch {
      showMessage("menu-message", SERVER_ERROR);
      return;
    }

    showMessage("menu-message", "");
    round = {
      level,
      minute: mode === "minute",
      target: data.text,
      typed: "",
      startTime: null,
      endTime: null,
      correctKeys: 0,
      totalKeys: 0,
    };
    const levelName = round.minute
      ? say(`${LEVEL_NAMES[level]}, 1 minute`, `${LEVEL_NAMES[level]}, 1 минута`)
      : LEVEL_NAMES[level];
    element("game-level").textContent = say(`Level: ${levelName}`, `Уровень: ${levelName}`);
    element("text").classList.toggle("minute", round.minute);
    element("text").replaceChildren(...[...round.target].map((char) => {
      const span = document.createElement("span");
      span.className = "char";
      span.textContent = char;
      return span;
    }));
    showScreen("game");
    drawRound();
    timer = setInterval(tick, 100);
  }

  function elapsedSeconds() {
    if (round.startTime === null) return 0;
    return ((round.endTime ?? performance.now()) - round.startTime) / 1000;
  }

  function correctChars() {
    let count = 0;
    for (let i = 0; i < round.typed.length; i++) {
      if (round.typed[i] === round.target[i]) count++;
    }
    return count;
  }

  function wpm() {
    const elapsed = elapsedSeconds();
    if (elapsed === 0) return 0;
    return (correctChars() / CHARS_PER_WORD) / (elapsed / 60);
  }

  function accuracy() {
    if (round.totalKeys === 0) return 100;
    return round.correctKeys / round.totalKeys * 100;
  }

  function typeChar(char) {
    if (round.startTime === null) round.startTime = performance.now();

    round.totalKeys++;
    if (char === round.target[round.typed.length]) round.correctKeys++;
    round.typed += char;

    if (round.typed.length === round.target.length) {
      round.endTime = performance.now();
      finishRound();
    } else {
      drawRound();
    }
  }

  function backspace() {
    round.typed = round.typed.slice(0, -1);
    drawRound();
  }

  function tick() {
    if (round.minute && elapsedSeconds() >= MINUTE_SECONDS) {
      round.endTime = round.startTime + MINUTE_SECONDS * 1000;
      finishRound();
    } else {
      drawStats();
    }
  }

  function drawStats() {
    // In a one minute round the clock counts down.
    const seconds = round.minute ? MINUTE_SECONDS - elapsedSeconds() : elapsedSeconds();
    element("stat-time").textContent = say(`${seconds.toFixed(1)}s`, `${seconds.toFixed(1)} с`);
    element("stat-wpm").textContent = wpm().toFixed(1);
    element("stat-accuracy").textContent = `${accuracy().toFixed(1)}%`;
  }

  function drawRound() {
    const spans = element("text").children;
    for (let i = 0; i < spans.length; i++) {
      let state = "";
      if (i === round.typed.length) state = "current";
      else if (i < round.typed.length) {
        state = round.typed[i] === round.target[i] ? "good" : "bad";
      }
      spans[i].className = `char ${state}`;
    }
    if (round.minute) scrollToCurrentChar();
    drawKeyboardHint(round.target[round.typed.length]);
    drawStats();
  }

  // Keeps the line being typed second from the top of the box.
  function scrollToCurrentChar() {
    const box = element("text");
    const lineHeight = parseFloat(getComputedStyle(box).lineHeight);
    const line = Math.floor(box.children[round.typed.length].offsetTop / lineHeight);
    box.scrollTop = Math.max(0, line - 1) * lineHeight;
  }

  // ----- Keyboard hint: shows the next key and the finger that presses it -----

  // Each row of keys: the plain characters, then the same keys with Shift.
  const KEY_ROWS = {
    en: [
      ["`1234567890-=", "~!@#$%^&*()_+"],
      ["qwertyuiop[]\\", "QWERTYUIOP{}|"],
      ["asdfghjkl;'", "ASDFGHJKL:\""],
      ["zxcvbnm,./", "ZXCVBNM<>?"],
    ],
    ru: [
      ["ё1234567890-=", "Ё!\"№;%:?*()_+"],
      ["йцукенгшщзхъ\\", "ЙЦУКЕНГШЩЗХЪ/"],
      ["фывапролджэ", "ФЫВАПРОЛДЖЭ"],
      ["ячсмитьбю.", "ЯЧСМИТЬБЮ,"],
    ],
  };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const KEY_STEP = 44;
  const KEY_SIZE = 40;
  const ROW_STARTS = [0, 66, 78, 100];

  // Fingers: 0-3 left pinky to index, 4-7 right index to pinky, 8-9 thumbs.
  const LEFT_THUMB = 8;
  const RIGHT_THUMB = 9;
  const RIGHT_PINKY = 7;
  const LEFT_PINKY = 0;
  const KEY_FINGERS = ["0012334456777", "0123344567777", "01233445677", "0123344567"];
  const HOME_COLUMNS = [0, 1, 2, 3, 6, 7, 8, 9];
  const FINGER_ROOTS = [
    [122, 268], [148, 254], [174, 250], [200, 256], [392, 256], [418, 250], [444, 254], [470, 268],
    [232, 282], [360, 282],
  ];

  const keyboard = { chars: new Map(), keys: [], fingers: [], homes: [] };

  function addSvg(parent, name, attributes) {
    const item = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, value);
    parent.append(item);
    return item;
  }

  // Draws one key. A finger rests just below the key's centre, keeping its label readable.
  function addKey(x, y, width, label) {
    const group = addSvg(element("keyboard"), "g", { class: "key" });
    addSvg(group, "rect", { x, y, width, height: KEY_SIZE, rx: 5 });
    addSvg(group, "text", { x: x + width / 2, y: y + 26 }).textContent = label;
    const key = { group, tip: [x + width / 2, y + KEY_SIZE + 2] };
    keyboard.keys.push(key);
    return key;
  }

  function buildKeyboard() {
    KEY_ROWS[language].forEach(([plain, shifted], row) => {
      [...plain].forEach((char, column) => {
        const x = ROW_STARTS[row] + column * KEY_STEP;
        const key = addKey(x, row * KEY_STEP, KEY_SIZE, char.toUpperCase());
        key.finger = Number(KEY_FINGERS[row][column]);
        keyboard.chars.set(char, { key, shift: false });
        keyboard.chars.set([...shifted][column], { key, shift: true });
        if (row === 2 && HOME_COLUMNS.includes(column)) {
          keyboard.homes[key.finger] = key.tip;
        }
      });
    });

    addKey(572, 0, 68, "");
    addKey(0, KEY_STEP, 62, "");
    addKey(0, 2 * KEY_STEP, 74, "");
    addKey(562, 2 * KEY_STEP, 78, "");
    keyboard.leftShift = addKey(0, 3 * KEY_STEP, 96, "Shift");
    keyboard.rightShift = addKey(540, 3 * KEY_STEP, 100, "Shift");
    keyboard.space = addKey(170, 4 * KEY_STEP, 252, say("Space", "Пробел"));
    keyboard.space.finger = RIGHT_THUMB;
    keyboard.homes[LEFT_THUMB] = [240, 4 * KEY_STEP + 30];
    keyboard.homes[RIGHT_THUMB] = [352, 4 * KEY_STEP + 30];

    const svg = element("keyboard");
    addSvg(svg, "rect", { class: "palm", x: 106, y: 262, width: 136, height: 90, rx: 34 });
    addSvg(svg, "rect", { class: "palm", x: 350, y: 262, width: 136, height: 90, rx: 34 });
    keyboard.fingers = FINGER_ROOTS.map(([x, y]) =>
      addSvg(svg, "line", { class: "finger", x1: x, y1: y }));
  }

  function moveFinger(finger, tip, active) {
    const line = keyboard.fingers[finger];
    line.setAttribute("x2", tip[0]);
    line.setAttribute("y2", tip[1]);
    line.classList.toggle("active", active);
  }

  function pressKey(key, finger) {
    key.group.classList.add("next");
    moveFinger(finger, key.tip, true);
  }

  function drawKeyboardHint(char) {
    for (const key of keyboard.keys) key.group.classList.remove("next");
    keyboard.homes.forEach((tip, finger) => moveFinger(finger, tip, false));

    if (char === " ") {
      pressKey(keyboard.space, keyboard.space.finger);
      return;
    }
    const found = keyboard.chars.get(char);
    if (!found) return;
    pressKey(found.key, found.key.finger);
    if (found.shift) {
      // Shift is pressed by the hand that is not typing the letter.
      if (found.key.finger <= 3) pressKey(keyboard.rightShift, RIGHT_PINKY);
      else pressKey(keyboard.leftShift, LEFT_PINKY);
    }
  }

  // ----- Results and scores -----

  async function finishRound() {
    clearInterval(timer);
    const finished = round;
    const speed = wpm();
    const correctness = accuracy();
    round = null;

    element("result-wpm").textContent = say(`${speed.toFixed(1)} WPM`, `${speed.toFixed(1)} сл/мин`);
    element("result-accuracy").textContent = `${correctness.toFixed(1)}%`;
    element("result-mistakes").textContent = finished.totalKeys - finished.correctKeys;
    const seconds = ((finished.endTime - finished.startTime) / 1000).toFixed(1);
    element("result-time").textContent = say(`${seconds} seconds`, `${seconds} сек`);
    showMessage("result-message", "");
    showScreen("results");

    try {
      const result = await fetchJson("/api/scores", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          level: finished.level,
          wpm: speed,
          accuracy: correctness,
        }),
      });
      if (result.new_record) {
        showMessage("result-message", say(`New best score for ${LEVEL_NAMES[finished.level]}!`,
                                           `Новый рекорд, уровень: ${LEVEL_NAMES[finished.level]}!`));
      }
      loadScores();
    } catch {
      showMessage("result-message", say("Your score could not be saved.",
                                         "Не удалось сохранить результат."));
    }
  }

  async function loadScores() {
    let scores;
    try {
      scores = await fetchJson("/api/scores");
    } catch {
      showMessage("menu-message", SERVER_ERROR);
      return;
    }

    element("score-rows").replaceChildren(...scores.map((score, index) => {
      const row = document.createElement("tr");
      const cells = [
        [index + 1, ""],
        [score.wpm.toFixed(1), "number"],
        [`${score.accuracy.toFixed(1)}%`, "number"],
        [LEVEL_NAMES[score.level] ?? score.level, ""],
        [score.date, ""],
      ];
      for (const [text, className] of cells) {
        const cell = document.createElement("td");
        cell.textContent = text;
        cell.className = className;
        row.append(cell);
      }
      return row;
    }));
    element("score-table").hidden = scores.length === 0;
    element("no-scores").hidden = scores.length > 0;
  }

  // ----- Keyboard and buttons -----

  function setMode(newMode) {
    mode = newMode;
    localStorage.setItem("mode", mode);
    for (const button of document.querySelectorAll("[data-mode]")) {
      button.setAttribute("aria-pressed", button.dataset.mode === mode);
    }
  }

  function showTips() {
    location.href = "/tips";
  }

  function handleGameKey(event) {
    if (event.key === "Escape") {
      goToMenu();
    } else if (round === null) {
      return;
    } else if (event.key === "Backspace") {
      event.preventDefault();
      backspace();
    } else if (event.key.length === 1) {
      event.preventDefault();  // Stops the browser using space, ' and / itself.
      typeChar(event.key);
    }
  }

  function handleMenuKey(event) {
    const level = { 1: "Easy", 2: "Medium", 3: "Hard" }[event.key];
    if (level) startRound(level);
    // event.code is the physical key, so this also works on a Russian layout.
    else if (event.code === "KeyH") showTips();
    else if (event.code === "KeyM") setMode(mode === "minute" ? "text" : "minute");
  }

  document.addEventListener("keydown", (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;

    if (screen === "game") handleGameKey(event);
    else if (screen === "menu") {
      if (!event.repeat) handleMenuKey(event);
    } else if (event.key === "Enter" && !event.repeat) {
      // Only Enter continues, so fast typers do not skip the screen by accident.
      event.preventDefault();
      goToMenu();
    }
  });

  for (const button of document.querySelectorAll("[data-level]")) {
    button.addEventListener("click", () => startRound(button.dataset.level));
  }
  for (const button of document.querySelectorAll("[data-back]")) {
    button.addEventListener("click", goToMenu);
  }
  for (const button of document.querySelectorAll("[data-language]")) {
    button.setAttribute("aria-pressed", button.dataset.language === language);
    button.addEventListener("click", () => {
      localStorage.setItem("language", button.dataset.language);
      location.reload();
    });
  }
  for (const button of document.querySelectorAll("[data-mode]")) {
    button.addEventListener("click", () => setMode(button.dataset.mode));
  }
  setMode(mode);
  buildKeyboard();
  element("show-tips").addEventListener("click", showTips);
  loadScores();
</script>
</body>
</html>
